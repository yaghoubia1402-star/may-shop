name = "may-shop"
main = "worker.js"
compatibility_date = "2026-08-13"

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/api/*"]

# In Cloudflare Dashboard, bind a Workers KV namespace to this Worker
# using the variable name: MAY_DATA
# The Worker will then store shared products and customer orders in that namespace.
