<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAY.SHOP | مدیریت</title><link rel="stylesheet" href="styles.css"></head>
<body><header class="topbar"><div class="brand">MAY<span>.SHOP</span></div><nav><a href="/">فروشگاه</a><a class="active" href="/admin-panel">مدیریت</a><button type="button" onclick="logout()">خروج</button></nav></header>
<main class="container"><section class="hero small"><h1>مدیریت فروشگاه</h1><p>مدیریت محصولات و سفارش‌های مشتریان</p><div id="adminStatus" class="status"></div></section>
<section class="panel"><h2 id="formTitle">افزودن محصول</h2><form id="productForm" class="form-grid">
<input type="hidden" id="editId"><input id="name" required placeholder="نام محصول"><input id="price" required type="number" min="0" placeholder="قیمت (تومان)">
<input id="cat" required placeholder="دسته‌بندی"><textarea id="description" placeholder="توضیحات و جزئیات محصول"></textarea><input id="imageUrl" placeholder="لینک عکس (اختیاری)">
<label class="file">یا انتخاب عکس از گوشی<input id="imageFile" type="file" accept="image/*"></label>
<div class="actions"><button id="submitBtn" class="primary">افزودن محصول</button><button type="button" id="cancelEdit" class="secondary">پاک کردن فرم</button></div>
</form></section>
<section class="panel"><h2>محصولات فعلی</h2><div id="adminProducts"></div></section>
<section class="panel">
<h2>سفارش‌های مشتریان</h2>
<div class="order-tools"><button id="refreshOrders" class="secondary">🔄 به‌روزرسانی سفارش‌ها</button><span class="muted">سفارش‌ها هر ۱۵ ثانیه هم خودکار بررسی می‌شوند.</span></div>
<div id="ordersList"><p class="muted">در حال دریافت...</p></div>
</section>

</main><footer>MAY.SHOP — مدیریت</footer><script src="config.js"></script><script src="admin.js"></script></body></html>
